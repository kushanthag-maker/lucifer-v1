<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCIFER-MD V26 PRO</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 50px; }
        .box { border: 2px solid #00ffcc; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px #00ffcc; display: inline-block; }
        input { padding: 10px; border-radius: 5px; border: none; width: 250px; margin-bottom: 20px; text-align: center; }
        button { background: #00ffcc; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #code { font-size: 2em; margin-top: 20px; color: #ff0055; letter-spacing: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>LUCIFER-MD V26</h1>
        <p>Enter your number with country code</p>
        <input type="text" id="number" placeholder="9475xxxxxxx"><br>
        <button onclick="getCode()">GET PAIRING CODE</button>
        <div id="code"></div>
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('number').value;
            const codeDiv = document.getElementById('code');
            if(!num) return alert("Enter Number!");
            
            codeDiv.innerHTML = "GENERATING...";
            
            try {
                const res = await fetch(`/get_pairing?number=${num}`);
                const data = await res.json();
                if(data.code) {
                    codeDiv.innerHTML = data.code;
                } else {
                    codeDiv.innerHTML = "ERROR! TRY AGAIN";
                }
            } catch(e) {
                codeDiv.innerHTML = "SERVER ERROR";
            }
        }
    </script>
</body>
</html>
